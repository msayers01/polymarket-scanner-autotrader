[project]
name = "pmtrader"
version = "0.1.0"
description = "Polymarket scanner + autotrader: structural arbitrage, model-based pricing, risk-managed execution."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=1.15,<2",
    "discord.py>=2.4",
    "fastapi>=0.115",
    "httpx[http2]>=0.27",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "uvicorn[standard]>=0.30",
    "websockets>=13,<16",
]

[project.optional-dependencies]
# Live order placement through the official Polymarket SDK (isolated in execution/polymarket_live.py).
live = ["polymarket-client>=0.13,<0.14"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
pmtrader = "pmtrader.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmtrader"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode math symbols in docstrings/comments are intentional
    "B008",                        # FastAPI/typer default-arg calls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/pmtrader"]

[[tool.mypy.overrides]]
module = ["pmtrader.discord_bot.*", "pmtrader.execution.polymarket_live"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test hits live public APIs (deselect with -m 'not network')"]
